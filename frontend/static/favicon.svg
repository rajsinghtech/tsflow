<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Network nodes -->
  <circle cx="25" cy="25" r="8" fill="url(#grad)" />
  <circle cx="75" cy="25" r="8" fill="url(#grad)" />
  <circle cx="50" cy="50" r="10" fill="url(#grad)" />
  <circle cx="25" cy="75" r="8" fill="url(#grad)" />
  <circle cx="75" cy="75" r="8" fill="url(#grad)" />

  <!-- Connection lines -->
  <line x1="25" y1="25" x2="50" y2="50" stroke="#3b82f6" stroke-width="2" />
  <line x1="75" y1="25" x2="50" y2="50" stroke="#3b82f6" stroke-width="2" />
  <line x1="50" y1="50" x2="25" y2="75" stroke="#3b82f6" stroke-width="2" />
  <line x1="50" y1="50" x2="75" y2="75" stroke="#3b82f6" stroke-width="2" />
</svg>
